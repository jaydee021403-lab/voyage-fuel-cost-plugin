interface:
  display_name: "Voyage Cost Calculation for Drifting/Holding (by PDM)"
  short_description: "Compare MAIN and ALT fuel costs after holding deductions"
  default_prompt: "Every time screenshots are supplied, do not require an Excel workbook when matching PVP/AROS screenshots already show complete route totals and holding data. Use screenshot-only direct mode to calculate every visible route: MAIN, ALT-1, ALT-2, ALT-3, and later alternatives, not only the selected route. Start with a side-by-side, color-coded comparison using one column per route and exactly these rows: Total fuel cost (excluding holding), signed Difference versus MAIN, and Total ME + AUX Cons (MT) (excluding holding). A bounded screenshot speed of approximately 1.0 kt or below is holding only for the route where it is visible; do not transfer holding from one route to another. If MAIN has no holding interval, keep its original PVP/AROS cost and Total ME + AUX Cons unchanged. Parse every holding interval, not only the first, including every DATE start/resume pair, every bounded low-speed interval, and every explicit chat interval. Deduplicate overlapping copies and sum all interval consumption/cost deductions for each route. Use each interval's own direct low-speed FOC/day, Average Daily Consumption, Remaining Consumption, or user-supplied holding rate. Never estimate a low-speed rate from an overall PVP average, another route, or a workbook curve; mark the affected interval/route unresolved when its direct rate is missing. Always show every route's holding schedule and deductions, including None visible with zero deduction. Calculate ALT difference as ALT non-holding total minus MAIN non-holding total; positive means more expensive and negative means savings. Use 🟦 MAIN, 🟥 ALT-1, 🟧 ALT-2, 🟪 ALT-3, and distinct colors for later routes. Use the latest exact-vessel workbook only when speed-curve reconstruction, validation, or a missing value requires it. Accept multiple chat-provided holding hours/days or UTC intervals in MM/DD HHMM to MM/DD HHMM format, with optional Z, including wording such as then another. Retain all intervals for the same vessel/voyage/route and let them override corresponding screenshot DATE durations. Do not deduct holding twice from a populated RAS-411 route grid whose displayed rows already exclude those intervals. Keep every visible route in the comparison, show unresolved only for missing route/interval inputs, and place signed ALT-minus-MAIN differences directly below every detailed ALT total."

